name: pianoflow
description: Piano learning app with falling notes and microphone pitch tracking.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^6.1.2
  file_picker: ^13.4.1
  flutter_midi_command: ^1.4.0
  flutter_midi_command_ble: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
